<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K's Project Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: full-bleed 3d room; a project panel slides in from the right, or up from the bottom on phones */
  --bg: #fceef2;
  --bg-deep: #f7d7e1;
  --ink: #4a2433;
  --muted: #94677a;
  --accent: #e0567f;
  --accent-soft: #fde0e8;
  --paper: #fffafc;
  --line: #f2cfda;
  --good: #3c9a70;
  --display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  /* soft spotlight behind the desk, fading to deeper pink at the edges */
  background: radial-gradient(55% 60% at 50% 52%, #fffafc 0%, var(--bg) 45%, var(--bg-deep) 100%);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  overflow: hidden;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.top { position: fixed; top: 16px; left: 18px; pointer-events: none; }
.top h1 { margin: 0; font: 600 22px/1.2 var(--display); letter-spacing: .01em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
#note { color: var(--accent); font-weight: 700; }
#note:empty { display: none; }

#labels { position: fixed; inset: 0; pointer-events: none; transition: opacity .3s; }
#labels.hide { opacity: 0; }
#labels.hide .label { pointer-events: none; }
.label {
  position: absolute; left: 0; top: 0;
  pointer-events: auto; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; white-space: nowrap;
  font: 600 13px/1 var(--display); color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
  box-shadow: 0 6px 16px -8px rgba(160, 60, 100, .45);
  transition: transform .2s, border-color .2s, opacity .3s;
}
.label:not(:focus-visible) { opacity: 0; pointer-events: none; }
#fade { position: fixed; inset: 0; background: var(--bg-deep); opacity: 0; pointer-events: none; transition: opacity .38s; }
#fade.on { opacity: 1; }
.label:hover, .label.hot { border-color: var(--accent); }
.label:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--accent); color: #fff; font: 700 11px/1 var(--body);
  font-variant-numeric: tabular-nums;
}

#panel {
  position: fixed; top: 12px; right: 12px; bottom: 12px;
  width: min(400px, calc(100% - 24px));
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 24px 60px -24px rgba(150, 50, 90, .4);
  transform: translateX(calc(100% + 24px));
  transition: transform .45s cubic-bezier(.2, .8, .2, 1);
}
#panel.open { transform: none; }
@media (max-width: 640px) {
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 64%; border-radius: 22px 22px 0 0; transform: translateY(105%); }
}
@media (prefers-reduced-motion: reduce) { #panel, .label, #labels { transition: none; } }

.phead { display: flex; gap: 12px; align-items: flex-start; padding: 18px 18px 10px; }
.phead > div { flex: 1; min-width: 0; }
.kicker { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
#pName { margin: 2px 0 2px; font: 600 24px/1.15 var(--display); text-wrap: balance; }
#pTag { margin: 0; color: var(--muted); font-size: 14px; }
.icon-btn {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  font-size: 20px; line-height: 1; cursor: pointer;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 18px 12px; }
.row label { font-size: 13px; color: var(--muted); font-weight: 700; }
select, input[type="text"], input[type="url"], textarea {
  font: inherit; color: var(--ink); background: #fff;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 10px;
}
textarea { width: 100%; resize: vertical; }
:is(select, input, textarea, button):focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 12px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 700; }
.ghost { border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 12px; background: transparent; color: var(--ink); font-weight: 700; font-size: 13px; }
.ghost:hover { border-color: var(--accent); }

.tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tabs button {
  border: 0; background: none; padding: 10px 10px 9px; color: var(--muted);
  font: 600 14px/1 var(--display); border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 16px 18px 24px; display: none; }
.pane.on { display: flex; flex-direction: column; gap: 20px; }
.pane h3 { margin: 0 0 8px; font: 600 15px/1.2 var(--display); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.list li > :is(label, a, .grow) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.list li.done label { color: var(--muted); text-decoration: line-through; }
.list a { color: var(--ink); font-weight: 700; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; border-radius: 8px; }
.x:hover { color: var(--accent); }
.x.confirm { color: #fff; background: var(--accent); font-size: 12px; font-weight: 700; padding: 4px 8px; }
.ext { flex: none; font: 700 10px/1 var(--body); text-transform: uppercase; padding: 5px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.add { display: flex; gap: 6px; }
.add input { flex: 1; min-width: 0; }
.add.two { flex-wrap: wrap; }
.add.two input { flex: 1 1 140px; }

.upload { display: inline-flex; align-items: center; gap: 8px; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

#chatLog { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 16px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg code { background: var(--accent-soft); border-radius: 5px; padding: 0 4px; font-size: 13px; }
.msg pre { background: #fff4f7; border: 1px solid var(--line); border-radius: 10px; padding: 8px; overflow-x: auto; font-size: 12.5px; }
.msg pre code { background: none; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
#chatForm { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: -24px; background: var(--paper); padding: 8px 0 0; }
#chatInput { flex: 1; min-height: 42px; max-height: 140px; resize: none; }
.chat-foot { display: flex; justify-content: space-between; gap: 8px; }

#toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px);
  max-width: min(420px, calc(100% - 32px));
  background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 5;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* holographic glass screen: the project panel floats over the room like a transparent display */
#panel {
  --holo: #dff6ff; --holo-dim: rgba(200, 236, 255, .62); --holo-line: rgba(170, 225, 255, .38); --holo-pink: #ff9cc0;
  color: var(--holo);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    linear-gradient(160deg, rgba(40, 70, 95, .58), rgba(14, 24, 36, .72));
  backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
  border: 1px solid rgba(190, 235, 255, .55); border-radius: 18px;
  box-shadow: 0 0 0 1px rgba(120, 210, 255, .12) inset, 0 0 28px rgba(120, 210, 255, .28), 0 30px 70px -30px rgba(0, 20, 40, .7);
  transform-origin: 100% 50%;
  transform: perspective(1400px) rotateY(-14deg) translateX(calc(100% + 40px));
  opacity: 0; transition: transform .55s cubic-bezier(.2, .8, .2, 1), opacity .35s;
}
#panel.open { transform: perspective(1400px) rotateY(-7deg); opacity: 1; animation: holoOn .5s steps(1, end); }
@keyframes holoOn { 0% { opacity: .2 } 12% { opacity: .9 } 20% { opacity: .4 } 30%, 100% { opacity: 1 } }
#panel::before, #panel::after {
  content: ""; position: absolute; width: 22px; height: 22px; pointer-events: none;
  border: 2px solid var(--holo); opacity: .8;
}
#panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
#panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
@media (max-width: 640px) {
  #panel { transform: translateY(105%); border-radius: 18px 18px 0 0; }
  #panel.open { transform: none; }
}
#panel .kicker { color: var(--holo-pink); font: 600 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .14em; }
#panel #pName { color: #fff; font-weight: 500; letter-spacing: .02em; text-shadow: 0 0 12px rgba(160, 225, 255, .6); }
#panel #pTag, #panel .empty, #panel .meta, #panel .hint, #panel .row label { color: var(--holo-dim); }
#panel .pane h3 { font: 600 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--holo); display: flex; align-items: center; gap: 8px; }
#panel .pane h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--holo-line), transparent); }
#panel .icon-btn { background: transparent; color: var(--holo); border-color: var(--holo-line); }
#panel :is(select, input[type="text"], input[type="url"], textarea) { background: rgba(10, 25, 40, .45); color: var(--holo); border: 1px solid var(--holo-line); border-radius: 8px; }
#panel ::placeholder { color: rgba(200, 236, 255, .4); }
#panel select option { color: #102030; }
#panel .btn { background: linear-gradient(135deg, #ff8fb8, #e0567f); border-radius: 8px; box-shadow: 0 0 14px rgba(255, 140, 185, .45); }
#panel .ghost { color: var(--holo); border-color: var(--holo-line); border-radius: 8px; }
#panel .ghost:hover, #panel .icon-btn:hover { border-color: var(--holo-pink); }
#panel .tabs { border-bottom-color: var(--holo-line); }
#panel .tabs button { color: var(--holo-dim); font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
#panel .tabs button.on { color: #fff; border-bottom-color: var(--holo-pink); text-shadow: 0 0 10px rgba(255, 156, 192, .7); }
#panel .list li { background: rgba(120, 200, 255, .06); border: 1px solid var(--holo-line); border-radius: 8px; }
#panel .list a { color: #fff; }
#panel .list input[type="checkbox"] { accent-color: var(--holo-pink); }
#panel .ext { background: rgba(255, 156, 192, .16); color: var(--holo-pink); }
#panel .msg.assistant { background: rgba(120, 200, 255, .08); border-color: var(--holo-line); color: var(--holo); }
#panel .msg.user { background: rgba(255, 140, 185, .8); }
#panel .msg :is(code, pre) { background: rgba(10, 25, 40, .5); border-color: var(--holo-line); color: var(--holo); }
#panel #chatForm { background: transparent; }
#panel .x { color: var(--holo-dim); }
.hud { display: flex; align-items: center; gap: 12px; padding: 0 18px 12px; color: var(--holo-dim); font: 500 10px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .1em; }
.hud svg { flex: none; }
.hud .bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.hud .bars i { width: 6px; border: 1px solid var(--holo-line); background: rgba(160, 225, 255, .35); animation: bar 2.4s ease-in-out infinite alternate; }
.hud .bars i:nth-child(2n) { animation-delay: -.8s; } .hud .bars i:nth-child(3n) { animation-delay: -1.5s; }
@keyframes bar { from { height: 30%; } to { height: 100%; } }
.hud .spin { transform-origin: 18px 18px; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .hud .bars i, .hud .spin, #panel.open { animation: none; } }

/* hologram, not a card: no backing sheet, separate glowing glass panes floating in a tilted plane, a projector beam below */
#pObject { display: none; }
#panel {
  --glow: rgba(110, 205, 255, .75); --holo: #e2f6ff;
  top: 36px; bottom: 96px; right: 28px; width: min(380px, calc(100% - 40px));
  background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  gap: 10px; overflow: visible;
  transform-origin: 100% 60%;
  transform: perspective(1100px) rotateY(-24deg) rotateX(4deg) translateX(calc(100% + 60px));
}
#panel.open { transform: perspective(1100px) rotateY(-16deg) rotateX(4deg); }
#panel::before { content: none; }
#panel::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -90px; height: 90px; border: 0; border-radius: 0; opacity: 1;
  background: linear-gradient(to top, rgba(120, 210, 255, .5), rgba(120, 210, 255, 0));
  clip-path: polygon(0 0, 100% 0, 58% 100%, 42% 100%); filter: blur(2px);
}
#panel :is(.phead, .hud, .pane.on) {
  background: linear-gradient(160deg, rgba(90, 190, 255, .16), rgba(20, 70, 130, .26));
  border: 1px solid var(--glow); border-radius: 4px;
  box-shadow: 0 0 14px rgba(90, 190, 255, .5), inset 0 0 22px rgba(90, 190, 255, .16);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#panel .phead { padding: 14px 14px 12px; }
#panel .hud { padding: 8px 12px; margin-right: 40px; }
#panel .row { padding: 0 2px; }
#panel .tabs { border: 0; padding: 0; gap: 6px; }
#panel .tabs button { border: 1px solid rgba(110, 205, 255, .4); border-radius: 3px; padding: 7px 10px; margin: 0; background: rgba(40, 120, 200, .14); }
#panel .tabs button.on { border-color: var(--glow); box-shadow: 0 0 10px rgba(90, 190, 255, .5); border-bottom-color: var(--glow); }
#panel .pane { padding: 14px; }
#panel, #panel #pTag, #panel h3 { text-shadow: 0 0 8px rgba(120, 210, 255, .55); }
#panel #pName { font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
#panel .icon-btn { border-radius: 4px; box-shadow: 0 0 8px rgba(90, 190, 255, .4); }
@media (max-width: 640px) {
  #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 64%; transform: translateY(110%); }
  #panel.open { transform: none; }
  #panel::after { content: none; }
}

/* readability: darker glass behind text and a gentler tilt, so bright rooms don't wash it out */
#panel :is(.phead, .hud, .pane.on) {
  background: linear-gradient(160deg, rgba(14, 40, 70, .82), rgba(8, 22, 42, .88));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#panel .row { padding: 6px 10px; border-radius: 4px; background: rgba(8, 22, 42, .78); border: 1px solid rgba(110, 205, 255, .35); }
#panel .tabs button { background: rgba(8, 22, 42, .82); }
#panel.open { transform: perspective(1100px) rotateY(-9deg) rotateX(2deg); }
#panel, #panel #pTag, #panel h3 { text-shadow: 0 0 6px rgba(120, 210, 255, .35); }
#panel #pTag, #panel .row label, #panel .meta, #panel .empty, #panel .hint { color: rgba(220, 242, 255, .82); }

/* glowing light edges instead of solid borders, like a projected display */
#panel :is(.phead, .hud, .pane.on, .row) {
  border: 1px solid rgba(150, 225, 255, .55); border-radius: 2px;
  background:
    linear-gradient(90deg, rgba(120, 210, 255, .14), transparent 18%, transparent 82%, rgba(120, 210, 255, .14)),
    linear-gradient(160deg, rgba(14, 44, 78, .74), rgba(6, 20, 40, .8));
  box-shadow:
    0 0 2px rgba(190, 240, 255, .9),
    0 0 10px rgba(90, 195, 255, .65),
    0 0 26px rgba(60, 160, 255, .4),
    0 0 50px rgba(60, 150, 255, .18),
    inset 0 0 18px rgba(90, 195, 255, .28);
  animation: holoPulse 4s ease-in-out infinite;
}
#panel .tabs button { border-color: rgba(150, 225, 255, .4); box-shadow: 0 0 8px rgba(90, 195, 255, .35); border-radius: 2px; }
#panel .tabs button.on { box-shadow: 0 0 3px rgba(190, 240, 255, .9), 0 0 14px rgba(90, 195, 255, .7); }
#panel :is(select, input[type="text"], input[type="url"], textarea), #panel .list li, #panel .ghost {
  border-color: rgba(150, 225, 255, .35); box-shadow: 0 0 8px rgba(90, 195, 255, .2), inset 0 0 8px rgba(90, 195, 255, .12); border-radius: 2px;
}
@keyframes holoPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
@media (prefers-reduced-motion: reduce) { #panel :is(.phead, .hud, .pane.on, .row) { animation: none; } }

/* more instrument than pop-up: a tab rail floating off the left edge with connector lines, live meters,
   corner ticks, a faint hex grid and a scan line sweeping the header */
#panel .hud { gap: 14px; padding: 10px 14px; margin-right: 0; }
#panel .meters { flex: 1; display: grid; gap: 6px; font: 600 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; }
#panel .meters div { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center; gap: 8px; }
#panel .meters span { color: rgba(200, 236, 255, .75); }
#panel .meters b { height: 6px; border: 1px solid rgba(150, 225, 255, .45); position: relative; overflow: hidden; }
#panel .meters b::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(150, 225, 255, .18) 0 3px, transparent 3px 6px); }
#panel .meters i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6fd3ff, #ff9cc0); box-shadow: 0 0 8px #6fd3ff; transition: width .6s; }
#panel .meters em { font-style: normal; text-align: right; color: #fff; }
#panel .hud .spin { transform-origin: 32px 32px; }
#hudArc { transition: stroke-dasharray .6s; filter: drop-shadow(0 0 3px #ff9cc0); }
@media (min-width: 641px) {
  #panel .tabs { position: absolute; left: -74px; top: 128px; flex-direction: column; gap: 14px; }
  #panel .tabs button { width: 58px; height: 58px; padding: 0; display: grid; place-items: center; font-size: 9px; letter-spacing: .1em; position: relative; }
  #panel .tabs button::after { content: ""; position: absolute; left: 100%; top: 50%; width: 16px; height: 1px; background: rgba(150, 225, 255, .7); box-shadow: 0 0 6px #6fd3ff; }
  #panel .tabs button.on::after { width: 18px; background: #ff9cc0; box-shadow: 0 0 6px #ff9cc0; }
}
#panel :is(.phead, .hud, .pane.on) {
  background-image:
    linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff),
    linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff), linear-gradient(#bfeaff, #bfeaff),
    radial-gradient(circle at 1px 1px, rgba(150, 225, 255, .14) 1px, transparent 1.5px),
    linear-gradient(160deg, rgba(14, 44, 78, .76), rgba(6, 20, 40, .84));
  background-size: 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 12px 12px, 100% 100%;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%, 0 0, 0 0;
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, repeat, no-repeat;
}
#panel .phead { position: relative; overflow: hidden; }
#panel .phead::after {
  content: ""; position: absolute; left: 0; right: 0; top: -40%; height: 40%; pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(150, 225, 255, .22), transparent);
  animation: sweep 3.5s linear infinite;
}
@keyframes sweep { to { top: 120%; } }
#panel #pName::before { content: "▸ "; color: #ff9cc0; text-shadow: 0 0 8px #ff9cc0; }
@media (prefers-reduced-motion: reduce) { #panel .phead::after { animation: none; display: none; } }

/* rounded glass to match the rest of the house; tabs back in a row as a glowing segmented pill */
#panel .tabs { position: static; flex-direction: row; gap: 4px; padding: 4px; align-self: flex-start;
  border: 1px solid rgba(150, 225, 255, .45); border-radius: 999px; background: rgba(8, 22, 42, .8);
  box-shadow: 0 0 10px rgba(90, 195, 255, .35); }
#panel .tabs button { width: auto; height: auto; padding: 7px 14px; border: 0; border-radius: 999px; background: none; box-shadow: none; font-size: 10px; }
#panel .tabs button::after { content: none; }
#panel .tabs button.on { background: rgba(120, 210, 255, .18); box-shadow: 0 0 10px rgba(90, 195, 255, .55), inset 0 0 0 1px rgba(170, 230, 255, .6); }
#panel :is(.phead, .hud, .pane.on, .row) {
  border-radius: 16px;
  background-image: radial-gradient(circle at 1px 1px, rgba(150, 225, 255, .12) 1px, transparent 1.5px), linear-gradient(160deg, rgba(14, 44, 78, .76), rgba(6, 20, 40, .84));
  background-size: 12px 12px, 100% 100%; background-position: 0 0, 0 0; background-repeat: repeat, no-repeat;
}
#panel :is(select, input[type="text"], input[type="url"], textarea), #panel .list li, #panel .ghost, #panel .btn { border-radius: 10px; }
#panel .meters b { border-radius: 999px; }
#panel .icon-btn { border-radius: 50%; }

#panel .pub { display: inline-flex; align-items: center; gap: 6px; color: rgba(220, 242, 255, .82); font-size: 13px; font-weight: 700; }
#panel .pub input { accent-color: #ff9cc0; width: 16px; height: 16px; }
/* public site: read-only, only what was chosen to share */
body.public #note, body.public #panel .row, body.public #panel .tabs, body.public #stepForm, body.public #linkForm,
body.public #panel .pane[data-pane="overview"] > div:has(#pNotes), body.public #panel .x { display: none; }
body.public #panel .list input { pointer-events: none; }
</style>

<body>
<canvas id="scene" aria-label="A pink 3D room. Each object opens one of your projects."></canvas>

<header class="top">
  <p id="note"></p>
</header>

<div id="labels"></div>

<aside id="panel" inert aria-label="Project">
  <div class="phead">
    <div>
      <p class="kicker" id="pObject"></p>
      <h2 id="pName"></h2>
      <p id="pTag"></p>
    </div>
    <button class="icon-btn" id="close" aria-label="Close project" hidden>×</button>
  </div>
  <div class="hud" aria-hidden="true">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="rgba(150,225,255,.35)"/>
      <polygon points="32,14 47,23 47,41 32,50 17,41 17,23" stroke="rgba(150,225,255,.2)"/>
      <circle cx="32" cy="32" r="21" stroke="rgba(150,225,255,.25)" stroke-width="5"/>
      <circle id="hudArc" cx="32" cy="32" r="21" stroke="#ff9cc0" stroke-width="5" stroke-dasharray="0 132" transform="rotate(-90 32 32)" stroke-linecap="round"/>
      <g class="spin"><path d="M32 2a30 30 0 0 1 30 30" stroke="rgba(150,225,255,.8)"/></g>
      <text id="hudPct" x="32" y="36" text-anchor="middle" fill="#e2f6ff" font-size="11" font-family="ui-monospace,Menlo,monospace">0%</text>
    </svg>
    <div class="meters">
      <div><span>STEPS</span><b><i id="mSteps"></i></b><em id="tSteps">0/0</em></div>
      <div><span>LINKS</span><b><i id="mLinks"></i></b><em id="tLinks">0</em></div>
      <div><span>FILES</span><b><i id="mFiles"></i></b><em id="tFiles">0</em></div>
    </div>
  </div>
  <div class="row">
    <label for="pStatus">Status</label>
    <select id="pStatus">
      <option value="idea">Idea</option>
      <option value="designing">Designing</option>
      <option value="building">Building</option>
      <option value="testing">Testing</option>
      <option value="paused">Paused</option>
    </select>
    <label class="pub"><input type="checkbox" id="pPublic"> Public</label>
    <button class="ghost" id="copyPrompt">Copy prompt for a full chat</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" class="on">Overview</button>
    <button role="tab" data-tab="files">Files <span id="fileCount" class="meta"></span></button>
    <button role="tab" data-tab="chat">Chat</button>
  </nav>

  <section class="pane on" data-pane="overview">
    <div>
      <h3>Next steps</h3>
      <ul class="list" id="steps"></ul>
      <form class="add" id="stepForm">
        <input type="text" id="stepInput" placeholder="Add a step" aria-label="New step">
        <button class="btn">Add</button>
      </form>
    </div>
    <div>
      <h3>Links and artifacts</h3>
      <ul class="list" id="links"></ul>
      <form class="add two" id="linkForm">
        <input type="text" id="linkTitle" placeholder="Name" aria-label="Link name">
        <input type="url" id="linkUrl" placeholder="https://" aria-label="Link address">
        <button class="btn">Add</button>
      </form>
    </div>
    <div>
      <h3><label for="pNotes">Notes</label></h3>
      <textarea id="pNotes" rows="6" placeholder="Ideas, decisions, parts lists…"></textarea>
    </div>
  </section>

  <section class="pane" data-pane="files">
    <div>
      <label class="upload btn" for="fileInput">Upload files
        <input type="file" id="fileInput" multiple>
      </label>
      <p class="hint">Images, PDFs and text files up to 20 MB, including KiCad schematics and boards. Keep 3D models and Gerber zips in GitHub and add the repo as a link.</p>
    </div>
    <ul class="list" id="files"></ul>
  </section>

  <section class="pane" data-pane="chat">
    <div id="chatLog"></div>
    <div>
      <form id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="Ask about this project" aria-label="Message"></textarea>
        <button class="btn" id="sendBtn">Send</button>
      </form>
      <div class="chat-foot">
        <p class="hint">Reads this project's notes, steps and text files.</p>
        <button class="x" id="clearChat" style="font-size:13px">Clear chat</button>
      </div>
    </div>
  </section>
</aside>

<div id="toast" role="status"></div>
<div id="fade"></div>

<script>window.PUBLIC = true;</script>
<script type="module">
import * as THREE from './three.module.min.js';
import { RoundedBoxGeometry } from './RoundedBoxGeometry.js';
import { RoomEnvironment } from './RoomEnvironment.js';

const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let current = null, busyPid = null, hovered = null;
const data = {}, chats = {}, chatSubs = {}, queues = {};

// renderer + camera
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
const scene = new THREE.Scene();
// soft studio reflections so materials read as wood, brass, fabric
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);

// helpers. ROOT is whichever room is being built, so helpers default to it
let ROOT = scene;
const v = (x, y, z) => new THREE.Vector3(x, y, z);
const rand = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(1234567);
const mats = {};
function mat(c, rough = 0.7, metal = 0) {
  return mats[c + rough + metal] ??= new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: metal, envMapIntensity: 0.38 });
}
const asMat = c => c.isMaterial ? c : mat(c);
function box(w, h, d, c, x, y, z, parent = ROOT, r = 0.06) {
  const rad = Math.min(r, Math.min(w, h, d) * 0.45);
  const g = rad > 0.005 ? new RoundedBoxGeometry(w, h, d, 3, rad) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, asMat(c));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function ball(r, c, x, y, z, parent = ROOT, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), asMat(c));
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt, rb, h, c, x, y, z, parent = ROOT, seg = 40) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), asMat(c));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function lathe(pts, c, parent = ROOT, side = THREE.FrontSide) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 48), asMat(c).clone());
  m.material.side = side; m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function tube(curve, r, c, parent = ROOT) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, r, 8), asMat(c));
  m.castShadow = true; parent.add(m); return m;
}
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  return t;

});
$('#pNotes').addEventListener('blur', e => {
  if (current && e.target.value !== (data[current]?.notes || '')) save(current, { notes: e.target.value });
});

// uploads: text-based engineering files go up as plain text so claude can read them
const TEXT_TYPES = { csv: 'text/csv', md: 'text/markdown', json: 'application/json' };
const TEXTY = /\.(kicad_\w+|net|sch|txt|md|csv|json|c|h|cpp|hpp|py|js|ts|v|sv|vhd|ino|toml|ya?ml|xml|log|cfg|ini|step|stp|gbr|drl)$/i;
$('#fileInput').addEventListener('change', async e => {
  const pid = current, picked = [...e.target.files]; e.target.value = '';
  if (!assets) return toast('Uploads need this page open on claude.ai with edit access.');
  for (const f of picked) {
    let blob = f;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!(f.type.startsWith('image/') || f.type.startsWith('video/') || f.type === 'application/pdf')) {
      if (!TEXTY.test(f.name)) { toast(`.${ext} files can’t be stored here. Put them in GitHub and add the repo as a link.`, 4500); continue; }
      blob = new Blob([f], { type: TEXT_TYPES[ext] || 'text/plain' });
    }
    try {
      toast(`Uploading ${f.name}…`, 10000);
      const r = await assets.upload(blob);
      await save(pid, { files: [...(data[pid]?.files || []).map(x => ({ ...x })), { id: r.id, url: r.url, name: f.name, size: r.sizeBytes, type: r.contentType, at: new Date().toISOString() }] });
      toast(`Added ${f.name}`);
    } catch (err) { toast(`${f.name}: ${err?.message || errText(err)}`, 4500); }
  }
});

// chat
const SUGGEST = ['What should I do next?', 'Summarize where this stands', 'Turn my notes into next steps'];
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt(t) {
  const parts = esc(t).split(/```(?:\w+)?\n?([\s\S]*?)```/g);
  return parts.map((p, i) => i % 2 ? `<pre><code>${p}</code></pre>`
    : p.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')).join('');
}
function scrollChat() { const p = document.querySelector('[data-pane="chat"]'); p.scrollTop = p.scrollHeight; }
function renderChat() {
  const log = $('#chatLog'); log.replaceChildren();
  if (!sample && db) { log.append(el('p', 'empty', 'Chat isn’t available in this view.')); return; }
  const msgs = chats[current] || [];
  if (!msgs.length) {
    log.append(el('p', 'empty', `Ask anything about ${data[current]?.name || NAMES[current]}. I can see its notes, steps and text files, and save steps or notes when you ask.`));
    const chips = el('div', 'chips');
    SUGGEST.forEach(s => { const b = el('button', 'ghost', s); b.type = 'button'; b.addEventListener('click', () => send(s)); chips.append(b); });
    log.append(chips);
  }
  msgs.forEach(m => { const b = el('div', 'msg ' + m.role); b.innerHTML = fmt(m.content); log.append(b); });
  scrollChat();
}

const fileText = {};
async function readTextFiles(d) {
  const texts = (d.files || []).filter(f => /^(text\/|application\/json)/.test(f.type || '')).slice(-4);
  let out = '', budget = 40000;
  for (const f of texts) {
    try {
      fileText[f.id] ??= await (await fetch(f.url || '/_blob/' + f.id)).text();
      const chunk = fileText[f.id].slice(0, Math.min(15000, budget));
      budget -= chunk.length;
      out += `\n--- ${f.name}${chunk.length < fileText[f.id].length ? ' (truncated)' : ''} ---\n${chunk}\n`;
      if (budget <= 0) break;
    } catch {}
  }
  return out;
}
async function context(pid) {
  const d = data[pid] || {};
  const steps = (d.steps || []).map(s => `- [${s.done ? 'x' : ' '}] ${s.text}`).join('\n') || '(none)';
  const links = (d.links || []).map(l => `- ${l.title}: ${l.url}`).join('\n') || '(none)';
  const files = (d.files || []).map(f => `- ${f.name} (${f.type})`).join('\n') || '(none)';
  return `You're helping K with one of her personal projects from her project room page. She's an engineer comfortable across hardware, firmware and UI. Be concise and practical, and stick to what she asks.
Only use the tools when she asks you to save, add or update something.

Project: ${d.name || NAMES[pid]}
About: ${d.tagline || '(none)'}
Status: ${d.status || 'idea'}
Next steps:
${steps}
Links:
${links}
Notes:
${d.notes || '(none)'}
Files:
${files}
${await readTextFiles(d)}`;
}
function merged(msgs) {
  // the model wants alternating turns; fold any repeats together
  const out = [];
  for (const m of msgs) {
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content;
    else out.push({ role: m.role, content: m.content });
  }
  return out;
}
async function send(text) {
  const pid = current;
  if (!pid || busyPid) return;
  if (!sample) return toast('Chat needs this page open on claude.ai.');
  busyPid = pid;
  $('#sendBtn').disabled = true;
  const msgs = [...(chats[pid] || []), { role: 'user', content: text, at: Date.now() }];
  chats[pid] = msgs; renderChat();
  const bubble = el('div', 'msg assistant', 'Thinking…'); $('#chatLog').append(bubble); scrollChat();
  const tools = [
    { name: 'add_next_steps', description: "Add items to this project's next-steps checklist.",
      inputSchema: { type: 'object', properties: { items: { type: 'array', items: { type: 'string' } } }, required: ['items'] },
      execute: async ({ items }) => { await save(pid, { steps: [...(data[pid]?.steps || []).map(x => ({ ...x })), ...items.map(t => ({ text: t, done: false }))] }); return { added: items.length }; } },
    { name: 'append_note', description: "Append text to this project's notes.",
      inputSchema: { type: 'object', properties: { text: { type: 'string' } }, required: ['text'] },
      execute: async ({ text }) => { const n = data[pid]?.notes || ''; await save(pid, { notes: n ? n + '\n\n' + text : text }); return { ok: true }; } },
  ];
  try {
    const input = [{ role: 'user', content: await context(pid) }, { role: 'assistant', content: 'Got it, I have the project context.' },
      ...merged(msgs.slice(-20))];
    const res = await sample(input, { cache: false, tools, onText: ({ text }) => { bubble.innerHTML = fmt(text); scrollChat(); } });
    msgs.push({ role: 'assistant', content: res.text, at: Date.now() });
  } catch (e) {
    if (e?.text) msgs.push({ role: 'assistant', content: e.text, at: Date.now() });
    if (e?.code === 'not_granted') { sample = null; }
    toast(e?.code === 'rate_limited' ? 'Claude is busy. Try again in a minute.' : e?.code === 'not_granted' ? 'Chat isn’t available in this view.' : 'The reply didn’t finish. Try again.');
  }
  chats[pid] = msgs.slice(-60);
  busyPid = null; $('#sendBtn').disabled = false;
  if (current === pid) renderChat();
  saveChat(pid);
}
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#chatInput').value.trim(); if (!v) return;
  $('#chatInput').value = ''; send(v);
});
$('#chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isSheet()) { e.preventDefault(); $('#chatForm').requestSubmit(); }
});
$('#clearChat').addEventListener('click', () => {
  if (!current || busyPid) return;
  chats[current] = []; renderChat(); saveChat(current);
});
$('#copyPrompt').addEventListener('click', async () => {
  const name = data[current]?.name || NAMES[current];
  const text = `Open my "K's Project Room" artifact and continue the ${name} project. Read its notes, next steps and files first, then add anything you make back to its card.`;
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into a new Claude chat.'); }
  catch { toast(text, 8000); }
});
</script>
</body>
</html>
