<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="skin" cx="42%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffd3e2"/><stop offset=".55" stop-color="#f7a3c0"/><stop offset="1" stop-color="#e57fa2"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c2" stop-opacity=".9"/><stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tentacles behind the head, curling outward -->
  <g fill="none" stroke="url(#skin)" stroke-width="34" stroke-linecap="round">
    <path d="M190 330 C150 370 110 380 92 352"/>
    <path d="M322 330 C362 370 402 380 420 352"/>
    <path d="M215 350 C200 410 168 440 140 430"/>
    <path d="M297 350 C312 410 344 440 372 430"/>
    <path d="M240 360 C236 420 228 452 206 462"/>
    <path d="M272 360 C276 420 284 452 306 462"/>
  </g>
  <!-- suction cups -->
  <g fill="#ffe3ec">
    <circle cx="116" cy="370" r="6"/><circle cx="140" cy="373" r="5"/>
    <circle cx="396" cy="370" r="6"/><circle cx="372" cy="373" r="5"/>
    <circle cx="170" cy="432" r="6"/><circle cx="192" cy="414" r="5"/>
    <circle cx="342" cy="432" r="6"/><circle cx="320" cy="414" r="5"/>
    <circle cx="228" cy="444" r="5"/><circle cx="284" cy="444" r="5"/>
  </g>

  <!-- screwdriver held up on the left -->
  <g transform="rotate(-28 96 300)">
    <rect x="90" y="196" width="10" height="70" rx="3" fill="#cfd3da"/>
    <path d="M90 196 L95 182 L100 196 Z" fill="#cfd3da"/>
    <rect x="80" y="262" width="30" height="58" rx="13" fill="#7fd3c8"/>
    <rect x="86" y="272" width="4" height="38" rx="2" fill="#5bb8ac"/>
    <rect x="100" y="272" width="4" height="38" rx="2" fill="#5bb8ac"/>
  </g>
  <path d="M188 318 C150 330 118 330 104 312" fill="none" stroke="url(#skin)" stroke-width="30" stroke-linecap="round"/>

  <!-- little glowing bulb held up on the right: an idea -->
  <circle cx="414" cy="214" r="62" fill="url(#glow)"/>
  <circle cx="414" cy="212" r="30" fill="#fff1b3" stroke="#f2c94c" stroke-width="5"/>
  <path d="M404 214 l6 -8 l8 8 l6 -8" fill="none" stroke="#e8a93a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="240" width="28" height="20" rx="5" fill="#b9bcc4"/>
  <path d="M400 248 h28 M400 255 h28" stroke="#9a9ea8" stroke-width="3"/>
  <path d="M324 318 C362 330 396 312 410 262" fill="none" stroke="url(#skin)" stroke-width="30" stroke-linecap="round"/>

  <!-- head -->
  <path d="M256 92 C352 92 392 164 392 238 C392 300 350 352 256 352 C162 352 120 300 120 238 C120 164 160 92 256 92 Z" fill="url(#skin)"/>
  <ellipse cx="214" cy="140" rx="34" ry="20" fill="#fff" opacity=".35" transform="rotate(-24 214 140)"/>

  <!-- safety goggles pushed up on the forehead -->
  <path d="M138 178 C190 150 322 150 374 178" fill="none" stroke="#5c5f6b" stroke-width="12" stroke-linecap="round"/>
  <g>
    <rect x="186" y="146" width="62" height="42" rx="20" fill="#7fd3c8" stroke="#4e5260" stroke-width="7"/>
    <rect x="264" y="146" width="62" height="42" rx="20" fill="#7fd3c8" stroke="#4e5260" stroke-width="7"/>
    <rect x="244" y="160" width="24" height="10" rx="5" fill="#4e5260"/>
    <path d="M200 158 l14 0" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M278 158 l14 0" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- face -->
  <ellipse cx="214" cy="252" rx="21" ry="26" fill="#2a2228"/>
  <ellipse cx="298" cy="252" rx="21" ry="26" fill="#2a2228"/>
  <circle cx="221" cy="242" r="8" fill="#fff"/><circle cx="305" cy="242" r="8" fill="#fff"/>
  <circle cx="209" cy="262" r="4" fill="#fff" opacity=".8"/><circle cx="293" cy="262" r="4" fill="#fff" opacity=".8"/>
  <ellipse cx="180" cy="290" rx="20" ry="12" fill="#ff7fa8" opacity=".55"/>
  <ellipse cx="332" cy="290" rx="20" ry="12" fill="#ff7fa8" opacity=".55"/>
  <path d="M242 290 Q256 304 270 290" fill="none" stroke="#2a2228" stroke-width="6" stroke-linecap="round"/>
</svg>
